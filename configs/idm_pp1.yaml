        - task: "indomain_inpainting" 
          prompt: ""
          negative_prompt: ""
          promptA: ${task_prompt.indomain_inpainting.placeholder_tokens} A seashell
          promptB: ${task_prompt.indomain_inpainting.placeholder_tokens} A seashell
          tradeoff: 1.0
          negative_promptA: ""
          negative_promptB: ""
