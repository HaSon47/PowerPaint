base_model_path: "/mnt/disk2/hachi/checkpoints/stable-diffusion-inpainting" 
ppt1_checkpoint: "/mnt/disk2/hachi/checkpoints/ppt-v1"
tracker_project_name: "idm_pp1_lre7"
report_to: "wandb"
output_dir: "/mnt/disk2/hachi/New_ouput_7"

# learnable task prompts
task_prompt:
  indomain_inpainting:
    placeholder_tokens: "P_loc"
    initializer_token: "P_ctxt"
    num_vectors_per_token: 10

# training data
train_data:
  resolution: 512
  datasets:
    name: "FSC147"
    data_path: "/mnt/disk2/hachi/data/train"

# training hyper-parameters
num_train_epochs: 10
lr_scheduler: "linear"
lr_warmup_steps: 100
learning_rate: 1e-7
max_train_steps: 4e3            # max training steps
train_batch_size: 8              # batch size per GPU
dataloader_num_workers: 4
gradient_accumulation_steps: 2
gradient_checkpointing: true

checkpointing_steps: 2e2
validation_steps: 2e2


# validation data
